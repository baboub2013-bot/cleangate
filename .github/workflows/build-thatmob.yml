name: Build ThatMob Mod

on:
  push:
    branches:
      - chatgpt-spawn-thatmob-build
    paths:
      - 'thatmob-build/**'
      - '.github/workflows/build-thatmob.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'thatmob-build/**'
      - '.github/workflows/build-thatmob.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.1'

      - name: Restore project
        shell: bash
        run: |
          mkdir -p thatmob-build/work
          base64 -d thatmob-build/source.tar.gz.b64 > thatmob-build/work/source.tar.gz
          tar -xzf thatmob-build/work/source.tar.gz -C thatmob-build/work

      - name: Build
        shell: bash
        working-directory: thatmob-build/work/Spawn-thatmob-Fabric-26.2
        run: gradle build --stacktrace

      - name: Save jar as base64
        if: github.event_name == 'push'
        shell: bash
        run: |
          base64 -w 0 thatmob-build/work/Spawn-thatmob-Fabric-26.2/build/libs/spawn-thatmob-1.0.0.jar > thatmob-build/output.jar.b64

      - name: Commit built jar payload
        if: github.event_name == 'push'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add thatmob-build/output.jar.b64
          git commit -m "Build ThatMob jar" || exit 0
          git push

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: spawn-thatmob-1.0.0
          path: thatmob-build/work/Spawn-thatmob-Fabric-26.2/build/libs/spawn-thatmob-1.0.0.jar
          if-no-files-found: error
